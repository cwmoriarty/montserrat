name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Test, and Verify
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer

      - name: Cache Filesystem Engines
        uses: actions/cache@v4
        with:
          path: engines/out
          key: engines-${{ runner.os }}-${{ hashFiles('engines/versions.env', 'engines/build-engines.sh', 'engines/patches/**', 'engines/montserrat-drivers/**', 'Sources/CCowFS/**', 'Sources/CAppleExplorer/**') }}

      - name: Install FUSE-T
        run: |
          brew install --cask macos-fuse-t/homebrew-cask/fuse-t || true

      - name: Build Montserrat Release
        run: |
          ./scripts/build.sh

      - name: Run Unit and Integration Tests
        run: |
          swift test

      - name: Run Block Device Integration Tests
        run: |
          ./scripts/run-integration-tests.sh

      - name: Package Distributable Artifacts (DMG and PKG)
        run: |
          ./scripts/package-release.sh

      - name: Audit Homebrew Formula
        run: |
          TAP_DIR="$(brew --repo)/Library/Taps/cwmoriarty/homebrew-tap/Formula"
          mkdir -p "$TAP_DIR"
          cp Formula/montserrat.rb "$TAP_DIR/montserrat.rb"
          brew trust --formula cwmoriarty/tap/montserrat
          brew audit --formula cwmoriarty/tap/montserrat
          brew style cwmoriarty/tap/montserrat
