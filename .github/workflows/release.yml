name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Package and Publish Release
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer

      - name: Cache Filesystem Engines
        uses: actions/cache@v4
        with:
          path: engines/out
          key: engines-${{ runner.os }}-${{ hashFiles('engines/versions.env', 'engines/build-engines.sh', 'engines/patches/**', 'engines/montserrat-drivers/**', 'Sources/CCowFS/**') }}

      - name: Install FUSE-T
        run: |
          brew install --cask macos-fuse-t/homebrew-cask/fuse-t || true

      - name: Build Universal Package
        run: |
          ARCHS="arm64 x86_64" ./scripts/build.sh
          VERSION="${{ github.ref_name }}" ./scripts/package-release.sh
          tar -czvf "montserrat-universal-${{ github.ref_name }}.tar.gz" -C dist bin engines conf FSKit

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*.dmg
            dist/release/*.pkg
            dist/release/checksums.txt
            montserrat-universal-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
